name: Runner Connectivity Check

on:
  push:
    branches:
      - ci/api-auto-deploy
    paths:
      - ".github/workflows/runner-connectivity-check.yml"

jobs:
  runner-check:
    runs-on:
      - self-hosted
      - linux
      - x64
      - schumacher-production

    steps:
      - name: Show runner identity
        run: |
          set -euo pipefail

          echo "user=$(id -un)"
          echo "group=$(id -gn)"
          echo "hostname=$(hostname)"
          echo "pwd=$PWD"
